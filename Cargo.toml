[workspace]
resolver = "2"
members = ["crates/core", "crates/comp", "crates/script", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
metal = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skia-safe = { version = "0.87", features = ["metal", "textlayout"] }
turbomotion-core = { path = "crates/core" }
turbomotion-comp = { path = "crates/comp" }
turbomotion-script = { path = "crates/script" }
oxc = { version = "=0.100.0", features = ["transformer", "codegen", "semantic"] }
oxc_sourcemap = "=6.1.1"
rquickjs = { version = "0.14", features = ["loader"] }

[profile.release]
lto = "thin"
codegen-units = 1
